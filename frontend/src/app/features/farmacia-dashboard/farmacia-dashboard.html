<div class="farmacia-container">
    <header class="dashboard-header">
        <div class="brand">
            <div class="logo-box">HE</div>
            <span>Hospital ESCOM - Caja y Farmacia</span>
        </div>
        <button routerLink="/login" class="btn-logout">Cerrar Sesión</button>
    </header>

    <main class="dashboard-main">
        <div class="grid-stats">
            <div class="stat-card">
                <h3>Operaciones de Caja</h3>
                <p>Nueva Venta</p>
                <button class="btn-action">Cobrar Productos</button>
            </div>
            <div class="stat-card">
                <h3>Reembolsos de Citas</h3>
                <p>Procesar Devolución</p>
                <button class="btn-action-alt">Ver Solicitudes</button>
            </div>
            <div class="stat-card">
                <h3>Inventario Disponible</h3>
                <p>Consultar Stock</p>
                <button class="btn-action-alt">Ver Catálogo</button>
            </div>
        </div>
    </main>
</div>
