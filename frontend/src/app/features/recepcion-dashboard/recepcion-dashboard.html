<div class="recepcion-container">
    <header class="dashboard-header">
        <div class="brand">
            <div class="logo-box">HE</div>
            <span>Hospital ESCOM - Recepción</span>
        </div>
        <button routerLink="/login" class="btn-logout">Cerrar Sesión</button>
    </header>

    <main class="dashboard-main">
        <div class="welcome-card">
            <h2>Control y Confirmación de Citas</h2>
            <p>Apoya en la administración de pacientes, confirmaciones y cancelaciones extraordinarias.</p>
        </div>

        <div class="grid-actions">
            <div class="action-card">
                <h3>Buscar Cita por Folio o Paciente</h3>
                <input type="text" placeholder="Ej. Juan Pérez">
                <button class="btn-primary">Buscar Cita</button>
            </div>
            <div class="action-card">
                <h3>Gestión de Personal Médico</h3>
                <p>Consulta el estatus actual de los médicos en turno.</p>
                <button class="btn-secondary">Ver Plantilla Médica</button>
            </div>
        </div>
    </main>
</div>
