<div class="dashboard-wrapper">

  <!-- ENCABEZADO INSTITUCIONAL DE RECEPCIÓN -->
  <div class="dashboard-header">
    <div class="header-info">
      <span class="icon">🏥</span>
      <div>
        <h2>Panel de Recepción y Administración</h2>
        <p>Control general de personal médico, citas y asistencia hospitalaria.</p>
      </div>
    </div>

    <!-- PESTAÑAS DE NAVEGACIÓN INTERNA -->
    <div class="dashboard-tabs">
      <button
        type="button"
        class="tab-btn"
        [class.active]="vistaActiva === 'citas'"
        (click)="cambiarVista('citas')">
        📅 Control de Citas
      </button>
      <button
        type="button"
        class="tab-btn"
        [class.active]="vistaActiva === 'medicos'"
        (click)="cambiarVista('medicos')">
        👨‍⚕️ Gestión de Médicos
      </button>
    </div>
  </div>

  <!-- CONTENEDOR DINÁMICO DE LAS VISTAS -->
  <div class="dashboard-content">
    <div *ngIf="vistaActiva === 'citas'" class="fade-in">
      <app-appointment-mgmt></app-appointment-mgmt>
    </div>

    <div *ngIf="vistaActiva === 'medicos'" class="fade-in">
      <app-staff-management></app-staff-management>
    </div>
  </div>

</div>
