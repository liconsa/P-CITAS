<div class="appointment-mgmt-container">
  <h2>Gestión de Citas (Recepción)</h2>
  <p *ngIf="mensaje" class="alert">{{ mensaje }}</p>

  <table>
    <thead>
      <tr>
        <th>ID Cita</th>
        <th>Fecha y Hora</th>
        <th>ID Paciente</th>
        <th>ID Médico</th>
        <th>Estado Actual</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cita of citas">
        <td>{{ cita.id }}</td>
        <td>{{ cita.fecha_hora | date:'short' }}</td>
        <td>{{ cita.paciente_id }}</td>
        <td>{{ cita.medico_id }}</td>
        <td>{{ cita.estado }}</td>
        <td>
          <button *ngIf="cita.estado === 'PENDIENTE'" (click)="cambiarEstadoCita(cita.id, 'CONFIRMADA')">Confirmar</button>
          <button *ngIf="cita.estado === 'PENDIENTE'" (click)="cambiarEstadoCita(cita.id, 'CANCELADA')">Cancelar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
